name: test-coverage

on:
  push:
    branches: [master, devel]
  pull_request:
    branches: [master, devel]

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup R and Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: devel

      - name: Persist CRAN + Bioconductor repos for later steps
        run: |
          # setup-bioc only sets options(repos=...) inside its own transient
          # R process (via BiocManager::install()); it never writes that to
          # ~/.Rprofile, so later steps' fresh R sessions (like pak's
          # dependency resolution below) don't see the Bioconductor repos and
          # fail to resolve CRAN-only transitive dependencies (e.g. log4r,
          # via MSstatsConvert). Write the full repos list explicitly so it
          # persists for the rest of the job.
          repos <- BiocManager::repositories()
          repos["CRAN"] <- "https://cloud.r-project.org"
          line <- paste0(
            "options(repos = c(",
            paste(sprintf('"%s" = "%s"', names(repos), repos), collapse = ", "),
            "))"
          )
          cat(line, "\n", file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v4
        with:
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
