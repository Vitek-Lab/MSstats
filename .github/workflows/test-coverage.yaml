name: test-coverage

on:
  push:
    branches: [master, devel]
  pull_request:
    branches: [master, devel]

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup R and Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: devel

      - name: Persist CRAN + Bioconductor repos for later steps
        run: |
          # setup-bioc's use-public-rspm behavior sets RENV_CONFIG_REPOS_OVERRIDE
          # to a CRAN-only Posit Package Manager URL. pak/pkgcache treat that
          # override as authoritative, so it wins over anything set via
          # options(repos=...) or ~/.Rprofile -- which is why pak could resolve
          # MSstatsConvert (via its own Bioconductor-aware logic) but not
          # log4r, a plain CRAN dependency missing from the override. Replace
          # the override with the full CRAN + Bioconductor repo set so later
          # steps' pak subprocess sees everything.
          repos <- BiocManager::repositories()
          repos["CRAN"] <- "https://cloud.r-project.org"

          line <- paste0(
            "options(repos = c(",
            paste(sprintf('"%s" = "%s"', names(repos), repos), collapse = ", "),
            "))"
          )
          cat(line, "\n", file = "~/.Rprofile", append = TRUE)

          cat(
            sprintf("RENV_CONFIG_REPOS_OVERRIDE=%s\n", paste(unname(repos), collapse = ",")),
            file = Sys.getenv("GITHUB_ENV"),
            append = TRUE
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v4
        with:
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
